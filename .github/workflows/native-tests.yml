name: Native Tests

on:
  push:
    branches:
      - main
      - fix/calendar-validation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate calendar results
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build native test executable
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Itests/native -I. \
            PersianDate.cpp tests/native/test_persian_date.cpp \
            -o tests/native/test_persian_date

      - name: Run calendar validation tests
        run: tests/native/test_persian_date
